name: Preview Deployment & Synthetic Probe

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-deploy:
    name: Preview 빌드·예산 게이트·배포
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Fast Verification
        run: npm run verify:fast

      - name: Build static export
        run: npm run build

      - name: Bundle Budget Gate
        run: npm run check:budget

      - name: Deploy PR Preview to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          ALIAS="pr-${{ github.event.pull_request.number }}"
          npx --yes wrangler@4.146.0 versions upload --preview-alias "${ALIAS}"

      - name: Run Synthetic Probe against Preview Build
        run: |
          node -e "
            import('./src/lib/devops/synthetic-probe.ts').then(async ({ verifyOfflineReadinessManifest }) => {
              const { precacheUrls, listFiles, isAppFile } = await import('./scripts/postbuild-lib.mts');
              const files = listFiles('out').filter(isAppFile);
              const urls = precacheUrls(files);
              const result = verifyOfflineReadinessManifest(urls);
              if (!result.offlineReady) {
                console.error('Synthetic probe failed. Missing routes:', result.missingRoutes);
                process.exit(1);
              }
              console.log('Synthetic probe passed. Traceparent:', result.traceparent);
            });
          "

  preview-cleanup:
    name: Preview 환경 정리
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log Preview Teardown
        run: |
          ALIAS="pr-${{ github.event.pull_request.number }}"
          echo "PR #${{ github.event.pull_request.number }} closed: preview alias ${ALIAS} teardown logged."
