# 출처 감시: 주 1회(월요일 09:13 KST) claim 출처를 열어 공식 시각표·금액·시각이 그대로인지 본다.
# 실패하면 GitHub가 저장소 주인에게 알린다. 배포·시크릿 없음. 수동 실행: Actions → Sources → Run workflow
name: Sources

on:
  schedule:
    - cron: "13 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 스크립트는 Node 내장 기능만 쓴다(의존성 설치 불필요)
      - name: Check claim sources
        run: node scripts/check-sources.mts
